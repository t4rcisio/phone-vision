<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#8ca3cf"/></marker><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1728"/><stop offset="1" stop-color="#152640"/></linearGradient></defs><rect width="1280" height="850" rx="28" fill="url(#bg)"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="28" fill="#f0f5ff" font-weight="bold">Phone Vision · Three experiences, one application</text><text x="48" y="80" font-size="16" fill="#adc1df">Separate camera owners. Explicit cloud requests. Continuous on-device motion tracking.</text><rect x="40" y="107" width="1200" height="62" rx="16" fill="#26395c" stroke="#657fae"/><text x="640" y="145" text-anchor="middle" font-size="21" fill="#f4f7ff">Jetpack Compose UI · ViewModels · Lifecycle-aware camera access</text><path d="M230 170V208" stroke="#8ca3cf" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="211" width="380" height="365" rx="20" fill="#15243b" stroke="#85d9ef" stroke-opacity=".6"/><text x="62" y="248" fill="#85d9ef" font-size="22" font-weight="bold">2D · Cloud vision</text><text x="62" y="276" fill="#b9c9df" font-size="14">Manual request / Internet</text><rect x="58" y="294" width="344" height="66" rx="12" fill="#253750"/><text x="71" y="320" font-size="17" fill="#f4f7ff" font-weight="bold">CameraX or gallery</text><text x="71" y="343" font-size="12.5" fill="#c0d0e5">Freeze the exact source image</text><path d="M230 361v16" stroke="#8ca3cf" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="58" y="381" width="344" height="66" rx="12" fill="#253750"/><text x="71" y="407" font-size="17" fill="#f4f7ff" font-weight="bold">Moondream HTTPS API</text><text x="71" y="430" font-size="12.5" fill="#c0d0e5">Query · Caption · Detect · Point · Segment</text><path d="M230 448v16" stroke="#8ca3cf" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="58" y="468" width="344" height="66" rx="12" fill="#253750"/><text x="71" y="494" font-size="17" fill="#f4f7ff" font-weight="bold">ImageTracker + Overlay</text><text x="71" y="517" font-size="12.5" fill="#c0d0e5">Reference matching &#8594; current preview</text><path d="M230 576v43" stroke="#8ca3cf" stroke-width="2" marker-end="url(#arrow)"/><path d="M640 170V208" stroke="#8ca3cf" stroke-width="2" marker-end="url(#arrow)"/><rect x="450" y="211" width="380" height="365" rx="20" fill="#15243b" stroke="#b8adff" stroke-opacity=".6"/><text x="472" y="248" fill="#b8adff" font-size="22" font-weight="bold">3D · Spatial anchoring</text><text x="472" y="276" fill="#b9c9df" font-size="14">ARCore + explicit cloud request</text><rect x="468" y="294" width="344" height="66" rx="12" fill="#253750"/><text x="481" y="320" font-size="17" fill="#f4f7ff" font-weight="bold">ARCore camera + depth</text><text x="481" y="343" font-size="12.5" fill="#c0d0e5">Capture pose, projection, depth and anchor</text><path d="M640 361v16" stroke="#8ca3cf" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="468" y="381" width="344" height="66" rx="12" fill="#253750"/><text x="481" y="407" font-size="17" fill="#f4f7ff" font-weight="bold">Moondream HTTPS API</text><text x="481" y="430" font-size="12.5" fill="#c0d0e5">Image-space coordinates and contours</text><path d="M640 448v16" stroke="#8ca3cf" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="468" y="468" width="344" height="66" rx="12" fill="#253750"/><text x="481" y="494" font-size="17" fill="#f4f7ff" font-weight="bold">CaptureGeometry + ArEngine</text><text x="481" y="517" font-size="12.5" fill="#c0d0e5">Source depth &#8594; world &#8594; current camera</text><path d="M640 576v43" stroke="#8ca3cf" stroke-width="2" marker-end="url(#arrow)"/><path d="M1050 170V208" stroke="#8ca3cf" stroke-width="2" marker-end="url(#arrow)"/><rect x="860" y="211" width="380" height="365" rx="20" fill="#15243b" stroke="#8be5c3" stroke-opacity=".6"/><text x="882" y="248" fill="#8be5c3" font-size="22" font-weight="bold">YOLO · Offline tracking</text><text x="882" y="276" fill="#b9c9df" font-size="14">No API key / No camera uploads</text><rect x="878" y="294" width="344" height="66" rx="12" fill="#253750"/><text x="891" y="320" font-size="17" fill="#f4f7ff" font-weight="bold">CameraX ImageAnalysis</text><text x="891" y="343" font-size="12.5" fill="#c0d0e5">Latest frame · shared preview crop</text><path d="M1050 361v16" stroke="#8ca3cf" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="878" y="381" width="344" height="66" rx="12" fill="#253750"/><text x="891" y="407" font-size="17" fill="#f4f7ff" font-weight="bold">Two independent workers</text><text x="891" y="430" font-size="12.5" fill="#c0d0e5">YOLO: fresh masks | VideoMotion: fast flow</text><path d="M1050 448v16" stroke="#8ca3cf" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="878" y="468" width="344" height="66" rx="12" fill="#253750"/><text x="891" y="494" font-size="17" fill="#f4f7ff" font-weight="bold">LiveYoloPipeline</text><text x="891" y="517" font-size="12.5" fill="#c0d0e5">Replay source-to-now motion &#8594; live overlay</text><path d="M1050 576v43" stroke="#8ca3cf" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="626" width="1200" height="105" rx="20" fill="#243750" stroke="#657fae"/><text x="70" y="660" fill="#f4f7ff" font-size="22" font-weight="bold">Shared local services</text><text x="70" y="696" fill="#c4d3e8" font-size="17">KeyVault · Android Keystore</text><text x="440" y="696" fill="#c4d3e8" font-size="17">HistoryStore · Atomic index + private images</text><text x="920" y="696" fill="#c4d3e8" font-size="17">MediaStore · Gallery export</text><rect x="40" y="756" width="1200" height="58" rx="14" fill="#102b2c" stroke="#3d897e"/><text x="640" y="791" text-anchor="middle" fill="#a2ead7" font-size="17">Network boundary: only explicit Moondream queries send an image and prompt to a remote service.</text></g></svg>